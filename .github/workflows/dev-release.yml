name: Dev Release

# dev 是**滚动发布**（固定 tag `dev`，资产每次覆盖），只有两种触发方式：
#   schedule  每 4 小时一次（cron 为 UTC）：main 前进后最迟 4 小时跟上
#   dispatch  手动触发（Actions 页面 Run workflow，或 `gh workflow run dev-release.yml`），
#             force=true 可忽略 commit 校验强制重发（例如资产损坏、想立刻要一个构建）
#
# **刻意不挂 push**：每次 push 都跑五平台 CGO 构建 + 覆盖上传，属于把 CI 和 Release
# 当流水账；也正好让下面的 commit 校验失效（push 时 commit 必然是新的）。要「push
# 完立刻有 dev」就直接手动触发一次。
#
# 两种触发都先做 **commit 校验**：dev-build.txt 里记着上次发布的 commit，与当前
# 一致就跳过构建与上传（定时触发十有八九命中这条），避免无意义地滚动构建号、刷 Release 时间。
# 之所以能这么省：dev 的语义是「main 的最近一次构建」，commit 没变就没有新东西可发。
on:
  schedule:
    - cron: "0 */4 * * *" # 每 4 小时（UTC）
  workflow_dispatch:
    inputs:
      force:
        description: 忽略 commit 校验，强制重新发布
        type: boolean
        default: false

permissions:
  contents: write # 更新滚动 dev 发布

concurrency:
  group: dev-release
  cancel-in-progress: false # 发布要串行，不能互相打断（否则可能出现半覆盖的资产）

# 发布物含 DuckDB（CGO），由原生 runner 矩阵构建（见 release.yml 的平台说明）。
jobs:
  decide:
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      release: ${{ steps.decide.outputs.release }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ldflags 里的 git describe 需要 tag 与历史

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: 取现有 dev 发布里的构建记录
        id: current
        run: |
          set -euo pipefail
          mkdir -p .dev-current
          if gh release download dev --pattern dev-build.txt --dir .dev-current --clobber 2>/dev/null; then
            echo "已有 dev 构建记录："; cat .dev-current/dev-build.txt
            echo "file=.dev-current/dev-build.txt" >> "$GITHUB_OUTPUT"
          else
            echo "尚无 dev 发布（或读不到记录）"
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      - name: 校验 commit 是否变化（决定要不要重复发布）
        id: decide
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          args=("$GITHUB_SHA")
          [[ -n "${{ steps.current.outputs.file }}" ]] && args+=("${{ steps.current.outputs.file }}")
          [[ "$FORCE" == "true" ]] && args+=(--force)
          bash scripts/dev-release-decision.sh "${args[@]}" | tee -a "$GITHUB_OUTPUT"

  test:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-26.04
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 测试（含 DuckDB 后端）
        run: |
          go test ./...
          make scripts-test

  build:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            name: linux-amd64
            target: linux/amd64
          - os: ubuntu-26.04-arm
            name: linux-arm64
            target: linux/arm64
          - os: macos-26
            name: darwin-amd64
            target: darwin/amd64
          - os: macos-26
            name: darwin-arm64
            target: darwin/arm64
          - os: windows-2025
            name: windows-amd64
            target: windows/amd64
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
      DEV_VERSION: dev-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Windows：缓存 WinLibs GCC 15 压缩包
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/winlibs.7z
          key: winlibs-gcc-15.2.0-ucrt-r7.7z
      - name: Windows：安装 WinLibs GCC 15（DuckDB 静态库使用 emulated TLS）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # GCC 16 起 MinGW 默认改用原生 TLS，而 duckdb-go 的 windows 静态库仍引用
          # __emutls_v._ZSt11__once_call（emulated TLS）。改用独立的 GCC 15.2.0 工具链：
          # 既满足 emutls，又避免与 MSYS2 里 GCC 16 的拆分包（libgcc/libstdc++）冲突。
          $ver = "15.2.0posix-14.0.0-ucrt-r7"
          $archive = "winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.7z"
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/$ver/$archive"
          $dir = Join-Path $env:RUNNER_TEMP "winlibs"
          $bin = Join-Path $dir "mingw64\bin"
          if (-not (Test-Path (Join-Path $bin "gcc.exe"))) {
            $file = Join-Path $env:RUNNER_TEMP "winlibs.7z"
            & curl.exe -sSL --fail -o $file $url
            if ($LASTEXITCODE -ne 0) { throw "下载 WinLibs 失败：$url" }
            $7z = "C:\Program Files\7-Zip\7z.exe"
            if (-not (Test-Path $7z)) { throw "缺少 7-Zip，无法解压 $archive" }
            & $7z x $file "-o$dir" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "解压 WinLibs 失败：$archive" }
          }
          if (-not (Test-Path (Join-Path $bin "gcc.exe"))) { throw "WinLibs 解压失败：未找到 $bin\gcc.exe" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $bin "gcc.exe") --version | Select-Object -First 1

      - name: 构建并打包 ${{ matrix.target }}
        # 必须显式 bash：Windows runner 默认 shell 是 pwsh，那里的 "$DEV_VERSION" 是
        # PowerShell 变量（空值），环境变量要写 $env:DEV_VERSION——曾因此拿不到版本号，
        # 脚本直接报 usage 并失败。
        shell: bash
        run: bash scripts/build-release.sh "$DEV_VERSION" "${{ matrix.target }}"

      - uses: actions/upload-artifact@v7
        with:
          name: dtool-${{ matrix.name }}
          path: dist/dtool_*
          if-no-files-found: error

  publish:
    needs: [decide, test, build]
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
      DEV_VERSION: dev-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 冒烟：校验嵌入的版本与元数据
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke && tar -xzf "dist/dtool_${DEV_VERSION}_linux_amd64.tar.gz" -C /tmp/smoke
          out="$(/tmp/smoke/dtool version)"
          echo "$out"
          grep -q "\"version\": \"${DEV_VERSION}\"" <<<"$out"
          grep -q "\"channel\": \"dev\"" <<<"$out"
          grep -q "\"commit\": \"${GITHUB_SHA}\"" <<<"$out"
          grep -q "\"build_id\": \"${GITHUB_RUN_ID}\"" <<<"$out"
          grep -q "\"builder\": \"github-actions\"" <<<"$out"
          /tmp/smoke/dtool --version | grep -q "${DEV_VERSION}"

      # artifact 在**改名之前**上传：里面的文件名带 run id，下载多次不会撞名，
      # 也便于「按某次 action 的制品离线安装」（只保留 dev 一个 Release 时的兜底路径）。
      - uses: actions/upload-artifact@v7
        with:
          name: dtool-${{ env.DEV_VERSION }}
          path: dist/dtool_*
          if-no-files-found: error
          retention-days: 14

      - name: 整理成滚动 dev 发布的资产
        # 逻辑在 scripts/dev-release-assets.sh（单测：scripts/tests/dev-release-assets.test.sh）
        run: BUILD_ID="$GITHUB_RUN_ID" COMMIT="$GITHUB_SHA" bash scripts/dev-release-assets.sh dist "$DEV_VERSION"

      - name: 更新滚动 dev 发布（tag dev）
        run: |
          set -euo pipefail
          # 说明正文交给脚本生成（有单测）：以前写在 $(printf '...' \ 续行里，
          # 反斜杠在 YAML 里被写坏时第二行参数会被 shell 当成命令，CI 上炸过。
          notes="$(bash scripts/dev-release-notes.sh "$DEV_VERSION" "$GITHUB_SHA" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "$GITHUB_EVENT_NAME")"
          printf '%s\n' "$notes"
          if ! gh release view dev >/dev/null 2>&1; then
            gh release create dev --prerelease --latest=false --title "$DEV_VERSION" --notes "$notes"
          fi
          gh release edit dev --title "$DEV_VERSION" --notes "$notes"
          gh release upload dev dist/* --clobber
          gh release view dev --json tagName,name,assets --jq '.tagName, .name, (.assets[].name)'

      - name: 汇总
        run: |
          {
            echo "### dev 发布"
            echo ""
            echo "- 触发：\`$GITHUB_EVENT_NAME\`"
            echo "- commit：\`$GITHUB_SHA\`"
            echo "- 决策：${{ needs.decide.outputs.reason }}"
            echo "- 发布：${{ needs.decide.outputs.release }}"
          } >> "$GITHUB_STEP_SUMMARY"
