name: CI

# 这里的职责是「校验」：测试 / lint。
# 唯一构建方式是 CGO=1：DuckDB 由 internal/query/duckdb.go 的 //go:build cgo 自动启用，
# **每一个二进制都同时支持 sqlite 与 duckdb**；CGO_ENABLED=0 会编译失败。
# 发版类的活儿在各自的工作流里，它们自己跑测试再发布：
#   release.yml        打 tag 后发正式版/预览版
#   dev-release.yml    每 4 小时 / 手动触发，更新滚动 dev 发布（commit 未变则跳过；刻意不挂 push）

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Windows：缓存 WinLibs GCC 15 压缩包
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/winlibs.7z
          key: winlibs-gcc-15.2.0-ucrt-r7.7z
      - name: Windows：安装 WinLibs GCC 15（DuckDB 静态库使用 emulated TLS）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # GCC 16 起 MinGW 默认改用原生 TLS，而 duckdb-go 的 windows 静态库仍引用
          # __emutls_v._ZSt11__once_call（emulated TLS）。改用独立的 GCC 15.2.0 工具链：
          # 既满足 emutls，又避免与 MSYS2 里 GCC 16 的拆分包（libgcc/libstdc++）冲突。
          $ver = "15.2.0posix-14.0.0-ucrt-r7"
          $archive = "winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.7z"
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/$ver/$archive"
          $dir = Join-Path $env:RUNNER_TEMP "winlibs"
          $bin = Join-Path $dir "mingw64\bin"
          if (-not (Test-Path (Join-Path $bin "gcc.exe"))) {
            $file = Join-Path $env:RUNNER_TEMP "winlibs.7z"
            & curl.exe -sSL --fail -o $file $url
            if ($LASTEXITCODE -ne 0) { throw "下载 WinLibs 失败：$url" }
            $7z = "C:\Program Files\7-Zip\7z.exe"
            if (-not (Test-Path $7z)) { throw "缺少 7-Zip，无法解压 $archive" }
            & $7z x $file "-o$dir" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "解压 WinLibs 失败：$archive" }
          }
          if (-not (Test-Path (Join-Path $bin "gcc.exe"))) { throw "WinLibs 解压失败：未找到 $bin\gcc.exe" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $bin "gcc.exe") --version | Select-Object -First 1
      - name: Test（sqlite + duckdb）
        run: go test ./...
      - name: 发布打包冒烟（Linux）
        if: runner.os == 'Linux'
        # 走与 release.yml 相同的脚本：本平台构建 + notices + 打包 + checksums
        run: |
          bash scripts/build-release.sh ci linux/amd64
          ls -lh dist

  lint:
    runs-on: ubuntu-26.04
    env:
      CGO_ENABLED: "1" # vet/tidy 也要看到 cgo 文件（DuckDB）
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          if ! unformatted="$(gofmt -l .)"; then exit 1; fi
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy 无差异
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: shell scripts
        run: bash -n scripts/*.sh
      - name: 脚本单测
        run: make scripts-test
      - name: 性能基准冒烟
        # 只跑一轮：确认基准本身可用（-benchtime 1x 不做耗时断言，避免 CI 抖动误报）
        run: go test -run '^$' -bench . -benchtime 1x ./internal/query/ ./internal/pipeline/
