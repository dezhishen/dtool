name: CI

# 这里的职责是「校验」：测试 / lint / 交叉编译。
# 发版类的活儿在各自的工作流里，它们自己跑测试再发布：
#   release.yml        打 tag 后发正式版/预览版
#   dev-release.yml    push main / 每 4 小时 / 手动触发，更新滚动 dev 发布（commit 未变则跳过）

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          if ! unformatted="$(gofmt -l .)"; then exit 1; fi
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go mod tidy 无差异
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: shell scripts
        run: bash -n scripts/*.sh
      - name: 脚本单测
        run: make scripts-test
      - name: 性能基准冒烟
        # 只跑一轮：确认基准本身可用（-benchtime 1x 不做耗时断言，避免 CI 抖动误报）
        run: go test -run '^$' -bench . -benchtime 1x ./internal/query/ ./internal/pipeline/

  # PR 与 release/** 分支：只验证能交叉编译并打包
  cross-build:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 交叉编译（无 CGO）
        run: make build-all release-build VERSION=ci

