name: Release

# tag 规则：预览版 vX.Y.0-preview.N；正式版 vX.Y.0；补丁版 vX.Y.Z（Z>=1）
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# 发布物包含 DuckDB（CGO），必须由各平台原生 runner 构建：
#   linux/amd64    ubuntu-26.04
#   linux/arm64    ubuntu-26.04-arm
#   darwin/amd64   macos-26（同一台机器按 -arch 构建）
#   darwin/arm64   macos-26
#   windows/amd64  windows-2025（WinLibs GCC 15：匹配 DuckDB 的 emulated TLS）
# DuckDB 没有 windows/arm64 预编译库，该平台不再随发布提供。
jobs:
  info:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.info.outputs.version }}
      prev: ${{ steps.info.outputs.prev }}
      kind: ${{ steps.info.outputs.kind }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 需要完整历史与 tag 来生成说明

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: 校验 tag 并计算对比基线
        id: info
        run: bash scripts/release-info.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

      - name: 校验 tag 所在分支
        env:
          KIND: ${{ steps.info.outputs.kind }}
        run: |
          branches="$(git branch -r --contains "$GITHUB_SHA" | sed 's|^ *origin/||')"
          echo "$branches"
          if [ "$KIND" = patch ]; then
            minor="$(echo "$GITHUB_REF_NAME" | sed -E 's/^v([0-9]+\.[0-9]+)\..*/\1/')"
            echo "$branches" | grep -Eqx "main|release/${minor}" \
              || { echo "补丁版必须打在 main 或 release/${minor} 上"; exit 1; }
          else
            echo "$branches" | grep -qx main \
              || { echo "预览版/正式版必须打在 main 上"; exit 1; }
          fi

      - name: 测试（含 DuckDB 后端）
        env:
          CGO_ENABLED: "1"
        run: |
          go test ./...
          make scripts-test

  build:
    needs: info
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            name: linux-amd64
            target: linux/amd64
          - os: ubuntu-26.04-arm
            name: linux-arm64
            target: linux/arm64
          - os: macos-26
            name: darwin-amd64
            target: darwin/amd64
          - os: macos-26
            name: darwin-arm64
            target: darwin/arm64
          - os: windows-2025
            name: windows-amd64
            target: windows/amd64
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ldflags 里的 git describe 需要 tag 与历史

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Windows：缓存 WinLibs GCC 15 压缩包
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/winlibs.7z
          key: winlibs-gcc-15.2.0-ucrt-r7.7z
      - name: Windows：安装 WinLibs GCC 15（DuckDB 静态库使用 emulated TLS）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # GCC 16 起 MinGW 默认改用原生 TLS，而 duckdb-go 的 windows 静态库仍引用
          # __emutls_v._ZSt11__once_call（emulated TLS）。改用独立的 GCC 15.2.0 工具链：
          # 既满足 emutls，又避免与 MSYS2 里 GCC 16 的拆分包（libgcc/libstdc++）冲突。
          $ver = "15.2.0posix-14.0.0-ucrt-r7"
          $archive = "winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.7z"
          $url = "https://github.com/brechtsanders/winlibs_mingw/releases/download/$ver/$archive"
          $dir = Join-Path $env:RUNNER_TEMP "winlibs"
          $bin = Join-Path $dir "mingw64\bin"
          if (-not (Test-Path (Join-Path $bin "gcc.exe"))) {
            $file = Join-Path $env:RUNNER_TEMP "winlibs.7z"
            & curl.exe -sSL --fail -o $file $url
            if ($LASTEXITCODE -ne 0) { throw "下载 WinLibs 失败：$url" }
            $7z = "C:\Program Files\7-Zip\7z.exe"
            if (-not (Test-Path $7z)) { throw "缺少 7-Zip，无法解压 $archive" }
            & $7z x $file "-o$dir" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "解压 WinLibs 失败：$archive" }
          }
          if (-not (Test-Path (Join-Path $bin "gcc.exe"))) { throw "WinLibs 解压失败：未找到 $bin\gcc.exe" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $bin "gcc.exe") --version | Select-Object -First 1

      - name: 构建并打包 ${{ matrix.target }}
        run: bash scripts/build-release.sh "${{ needs.info.outputs.version }}" "${{ matrix.target }}"

      - uses: actions/upload-artifact@v7
        with:
          name: dtool-${{ matrix.name }}
          path: dist/dtool_*
          if-no-files-found: error

  publish:
    needs: [info, build]
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: 生成 checksums.txt
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          ((${#archives[@]})) || { echo "没有下载到任何产物" >&2; exit 1; }
          (cd dist && sha256sum "${archives[@]##*/}") > dist/checksums.txt
          cat dist/checksums.txt

      - name: 生成 Release 说明（PR + commits）
        run: |
          bash scripts/release-notes.sh "$GITHUB_REF_NAME" "${{ needs.info.outputs.prev }}" "$GITHUB_REPOSITORY" > notes.md
          cat notes.md

      - name: 创建/更新 Release
        env:
          PRERELEASE: ${{ needs.info.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag "${flags[@]}"
          fi
