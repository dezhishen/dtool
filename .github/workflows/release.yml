name: Release

# tag 规则：预览版 vX.Y.0-preview.N；正式版 vX.Y.0；补丁版 vX.Y.Z（Z>=1）
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

# 发布物包含 DuckDB（CGO），必须由各平台原生 runner 构建：
#   linux/amd64    ubuntu-26.04
#   linux/arm64    ubuntu-26.04-arm
#   darwin/amd64   macos-26（同一台机器按 -arch 构建）
#   darwin/arm64   macos-26
#   windows/amd64  windows-2025（MSYS2 gcc）
# DuckDB 没有 windows/arm64 预编译库，该平台不再随发布提供。
jobs:
  info:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.info.outputs.version }}
      prev: ${{ steps.info.outputs.prev }}
      kind: ${{ steps.info.outputs.kind }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 需要完整历史与 tag 来生成说明

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: 校验 tag 并计算对比基线
        id: info
        run: bash scripts/release-info.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"

      - name: 校验 tag 所在分支
        env:
          KIND: ${{ steps.info.outputs.kind }}
        run: |
          branches="$(git branch -r --contains "$GITHUB_SHA" | sed 's|^ *origin/||')"
          echo "$branches"
          if [ "$KIND" = patch ]; then
            minor="$(echo "$GITHUB_REF_NAME" | sed -E 's/^v([0-9]+\.[0-9]+)\..*/\1/')"
            echo "$branches" | grep -Eqx "main|release/${minor}" \
              || { echo "补丁版必须打在 main 或 release/${minor} 上"; exit 1; }
          else
            echo "$branches" | grep -qx main \
              || { echo "预览版/正式版必须打在 main 上"; exit 1; }
          fi

      - name: 测试（含 DuckDB 后端）
        env:
          CGO_ENABLED: "1"
        run: |
          go test ./...
          make scripts-test

  build:
    needs: info
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            name: linux-amd64
            target: linux/amd64
          - os: ubuntu-26.04-arm
            name: linux-arm64
            target: linux/arm64
          - os: macos-26
            name: darwin-amd64
            target: darwin/amd64
          - os: macos-26
            name: darwin-arm64
            target: darwin/arm64
          - os: windows-2025
            name: windows-amd64
            target: windows/amd64
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ldflags 里的 git describe 需要 tag 与历史

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Windows：准备 MSYS2 UCRT64 gcc
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Windows：把 UCRT64 gcc 加进 PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gcc = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "ucrt64\bin"
          if (-not (Test-Path "$gcc\gcc.exe")) { throw "未找到 $gcc\gcc.exe（MSYS2 UCRT64 gcc 未安装成功）" }
          $gcc | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 构建并打包 ${{ matrix.target }}
        run: bash scripts/build-release.sh "${{ needs.info.outputs.version }}" "${{ matrix.target }}"

      - uses: actions/upload-artifact@v7
        with:
          name: dtool-${{ matrix.name }}
          path: dist/dtool_*
          if-no-files-found: error

  publish:
    needs: [info, build]
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: 生成 checksums.txt
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          ((${#archives[@]})) || { echo "没有下载到任何产物" >&2; exit 1; }
          (cd dist && sha256sum "${archives[@]##*/}") > dist/checksums.txt
          cat dist/checksums.txt

      - name: 生成 Release 说明（PR + commits）
        run: |
          bash scripts/release-notes.sh "$GITHUB_REF_NAME" "${{ needs.info.outputs.prev }}" "$GITHUB_REPOSITORY" > notes.md
          cat notes.md

      - name: 创建/更新 Release
        env:
          PRERELEASE: ${{ needs.info.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag "${flags[@]}"
          fi
